name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
      - name: Check API availability
        run: ./check_api.sh https://httpbin.org/status/200
